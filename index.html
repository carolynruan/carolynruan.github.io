<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carolyn Ruan</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-root="./">
  <main>
    <div class="photo-feed" id="feed"></div>
  </main>
  <footer>&copy; Carolyn Ruan</footer>

  <script type="module">
    import { renderNav, revealOnScroll, root } from "./assets/js/site.js";
    import { photos } from "./assets/js/data.js";

    renderNav();
    document.getElementById("feed").innerHTML = photos
      .map((p) => `<figure class="reveal"><img src="${root}${p.src}" alt="${p.alt}" width="${p.w}" height="${p.h}" loading="lazy"></figure>`)
      .join("");
    revealOnScroll();
  </script>
</body>
</html>
